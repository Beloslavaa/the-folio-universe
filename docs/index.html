<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<title>thefolio. — Floating Archive</title>
<style>
  html, body { margin:0; padding:0; background:#fff; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; font-family:Arial, Helvetica, sans-serif; color:#3C83F6; -webkit-font-smoothing:antialiased; }
  #ui a, #ui .btn { pointer-events:auto; }
  a { color:#3C83F6; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .tl { position:absolute; top:22px; left:24px; font-size:14px; line-height:1.35; }
  .btn { cursor:pointer; }
  .btn:hover { text-decoration:underline; }
  .bl { position:absolute; bottom:22px; left:24px; max-width:340px; font-size:13px; line-height:1.45; }
  .br { position:absolute; bottom:22px; right:24px; font-size:13px; color:#3C83F6; }
  #panel { position:absolute; top:0; right:0; bottom:0; width:min(400px, 40vw); padding:22px 24px 28px; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; overflow:auto; -webkit-overflow-scrolling:touch; background:#fff; border-left:1px solid rgba(60,131,246,0.25); pointer-events:none; z-index:5; opacity:0; transform:translateX(28px); transition:opacity .45s ease, transform .45s ease; }
  #panel.open { pointer-events:auto; opacity:1; transform:translateX(0); }
  .panel-head { display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
  #i-title { font-style:normal; font-weight:500; font-size:19px; line-height:1.2; }
  #close { font-size:13px; white-space:nowrap; }
  #i-sub { font-style:normal; font-size:15px; }
  #i-meta { font-style:normal; color:#3C83F6; font-size:13px; }
  #i-body { display:flex; flex-direction:column; gap:11px; margin-top:6px; font-size:13.5px; line-height:1.55; color:#3C83F6; text-wrap:pretty; }
  .cta { display:block; margin-top:16px; font-size:22px; font-weight:700; color:#3C83F6; text-decoration:none; }
  .cta:hover { color:#2f6fd8; text-decoration:none; }
  .it { font-style:normal; }
  .mut { color:#3C83F6; }
  /* Similar-covers grid: only shown on phone (see media query below) — on
     desktop the ring + highlighter web already do this job next to the panel. */
  #i-neighbors { display:none; }

  @media (max-width: 700px){
    .tl { top:14px; left:14px; font-size:12px; }
    .bl { bottom:14px; left:14px; max-width:60vw; font-size:11px; line-height:1.35; }
    .br { bottom:14px; right:14px; font-size:10px; }
    #panel { width:100%; padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateY(28px); }
    #i-title { font-size:17px; }
    #i-sub { font-size:14px; }
    #i-body { font-size:13px; }
    .cta { font-size:18px; }
    #i-neighbors { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:20px; }
    #i-neighbors:empty { display:none; }
    #i-neighbors img { width:100%; aspect-ratio:3/4; object-fit:cover; cursor:pointer; opacity:.82; transition:opacity .15s ease; }
    #i-neighbors img:active { opacity:1; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div class="tl">
    <div style="font-weight:700">thefolio universe</div>
    <div id="count">cargando…</div>
  </div>
  <div class="bl">
    <div id="hint" class="mut">Arrastra para orbitar — desplaza para hacer zoom — toca una portada</div>
  </div>
  <div id="panel">
    <div class="panel-head">
      <div id="i-title"></div>
      <span class="btn mut" id="close">(Cerrar)</span>
    </div>
    <div id="i-sub"></div>
    <div id="i-meta"></div>
    <div id="i-body"></div>
    <a id="i-url" target="_blank" rel="noopener" class="cta">[ ver el número completo ]</a>
    <div id="i-neighbors"></div>
  </div>
  <div class="br">© thefolio. 2026</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const decode = s => { const d = document.createElement('textarea'); d.innerHTML = s || ''; return d.value; };

const isTouch = matchMedia('(pointer:coarse)').matches;
document.getElementById('hint').textContent = isTouch
  ? 'Gira, acerca y toca una portada'
  : 'Arrastra para orbitar — desplaza para hacer zoom — toca una portada';

function layout(n, seed){
  const pts = [], gold = Math.PI * (3 - Math.sqrt(5));
  let s = seed || 1;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++){
    const y = 1 - (i / Math.max(1, n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y*y));
    const th = gold * i;
    const R = 13 + rnd() * 7;
    pts.push([Math.cos(th)*r*R, y*(7.5 + rnd()*2.5), Math.sin(th)*r*R]);
  }
  return pts;
}

const BG = 0xffffff;
const host = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.006);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
host.appendChild(renderer.domElement);

const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';
const covers = [];
let bobPhase = [], base = [], homePos = [];
// Bobbing is suspended (not just while a cover is focused, but until any
// in-flight "return home" tween finishes) so it doesn't fight gsap's
// position tween for the y axis — see settleTimer below.
let settled = true, settleTimer = null;
function unsettleFor(duration){
  settled = false;
  if (settleTimer) settleTimer.kill();
  settleTimer = gsap.delayedCall(duration, () => { settled = true; });
}

// embeddings.json is produced by scripts/embed.py (run daily alongside the
// scraper) and maps slug -> normalized MobileNetV2 feature vector. It's
// optional: if it hasn't been generated yet, "similar cover" highlighting
// is simply skipped rather than breaking anything.
let embeddings = null;
async function loadEmbeddings(){
  try {
    const res = await fetch('./public/embeddings.json', { cache:'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    embeddings = data.embeddings;
  } catch (err) {
    console.warn('No embeddings.json (similar-cover highlighting disabled):', err);
  }
}
loadEmbeddings();

// Vectors are pre-normalized, so cosine similarity is just a dot product.
function nearestSlugs(slug, n){
  if (!embeddings || !embeddings[slug]) return [];
  const v = embeddings[slug];
  return Object.keys(embeddings)
    .filter(s => s !== slug)
    .map(s => {
      const w = embeddings[s];
      let dot = 0;
      for (let i = 0; i < v.length; i++) dot += v[i] * w[i];
      return [s, dot];
    })
    .sort((a, b) => b[1] - a[1])
    .slice(0, n)
    .map(([s]) => s);
}
function highlightSimilar(sp){
  const neighbors = new Set(nearestSlugs(sp.userData.slug, 6));
  if (!neighbors.size) return;
  covers.forEach(sp2 => {
    const keep = sp2 === sp || neighbors.has(sp2.userData.slug);
    gsap.to(sp2.material, { opacity: keep ? 1 : 0.15, duration:0.8, ease:'power2.out' });
  });
}
function clearHighlight(){
  covers.forEach(sp2 => gsap.to(sp2.material, { opacity:1, duration:0.6, ease:'power2.out' }));
}

// The plane a viewer at (theta, phi) actually sees as "around" a target —
// i.e. the two axes perpendicular to the camera's line of sight — so a ring
// built from it reads as a ring on screen instead of an edge-on line. `dir`
// itself (target -> camera) is what lets arrangeAround() push things back
// into depth rather than just sideways.
function viewPlaneBasis(theta, phi){
  const s = Math.sin(phi), c = Math.cos(phi);
  const dir = new THREE.Vector3(s*Math.sin(theta), c, s*Math.cos(theta));
  const worldUp = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(worldUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  return { right, up, dir };
}

// A soft-edged, faintly uneven swatch (transparent top/bottom, mottled
// horizontally) so a stretched quad reads as a highlighter-marker stroke
// rather than a hard-edged bar.
const markerTexture = (() => {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 64);
  grad.addColorStop(0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.5, 'rgba(255,255,255,1)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  // Per-column noise, built on a separate canvas and composited in ONE
  // destination-in pass — applying destination-in per column instead would
  // clear the whole canvas on every iteration (each pass keeps only the
  // overlap and wipes everything else), leaving just the last column.
  const noise = document.createElement('canvas');
  noise.width = 64; noise.height = 64;
  const nctx = noise.getContext('2d');
  for (let x = 0; x < 64; x++){
    nctx.fillStyle = `rgba(0,0,0,${0.7 + Math.random()*0.3})`;
    nctx.fillRect(x, 0, 1, 64);
  }
  ctx.globalCompositeOperation = 'destination-in';
  ctx.drawImage(noise, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
})();
const STROKE_WIDTH = 0.4;

// Blue "highlighter" strokes from the focused cover to each of its
// currently-highlighted neighbors. Each is a camera-facing quad (not a
// THREE.Line — WebGL line width is capped at 1px on most platforms, too
// thin to read as a marker stroke), rendered with depthTest/depthWrite off
// and a renderOrder below the cover sprites' default, so a stroke can never
// paint over a cover — sprites always composite on top of it.
let webLines = [];
function buildWeb(sp, neighborSprites){
  clearWeb();
  neighborSprites.forEach(sp2 => {
    const mat = new THREE.MeshBasicMaterial({
      map: markerTexture, color: 0x3C83F6, transparent: true, opacity: 0,
      depthTest: false, depthWrite: false,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    mesh.renderOrder = -1;
    scene.add(mesh);
    gsap.to(mat, { opacity:0.55, duration:1, delay:0.5, ease:'power2.out' });
    webLines.push({ mesh, sp2 });
  });
}
function clearWeb(){
  webLines.forEach(({ mesh }) => { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); });
  webLines = [];
}
const _wr = new THREE.Vector3(), _wu = new THREE.Vector3();
function updateWeb(){
  if (!selected) return;
  const p1 = selected.position;
  _wr.set(1,0,0).applyQuaternion(camera.quaternion);
  _wu.set(0,1,0).applyQuaternion(camera.quaternion);
  webLines.forEach(({ mesh, sp2 }) => {
    const p2 = sp2.position;
    const dx = p2.x-p1.x, dy = p2.y-p1.y, dz = p2.z-p1.z;
    const len = Math.hypot(dx, dy, dz) || 0.0001;
    mesh.position.set((p1.x+p2.x)/2, (p1.y+p2.y)/2, (p1.z+p2.z)/2);
    mesh.quaternion.copy(camera.quaternion);
    mesh.rotateZ(Math.atan2(dx*_wu.x+dy*_wu.y+dz*_wu.z, dx*_wr.x+dy*_wr.y+dz*_wr.z));
    mesh.scale.set(len, STROKE_WIDTH, 1);
  });
}

// Pulls the focused cover's nearest neighbors into a second, background
// layer: spread out in the camera's view plane (so the web above reads as a
// clear web, not an overlapping pile) and pushed back in depth so they
// register as behind — smaller, layered — rather than crowding the
// close-up focused cover. Every other cover goes back to its regular spot.
// Rough/scattered placement around the ring is fine — it doesn't need to be tidy.
function arrangeAround(sp, theta, dur){
  const neighborSlugs = new Set(nearestSlugs(sp.userData.slug, 6));
  const { right, up, dir } = viewPlaneBasis(theta, 1.5);
  const p = sp.position;
  const n = neighborSlugs.size;
  const RING = 7.5, DEPTH = 5.5;
  const neighborSprites = [];
  let i = 0;
  gsap.killTweensOf(sp.position);
  covers.forEach((sp2, idx) => {
    if (sp2 === sp) return;
    gsap.killTweensOf(sp2.position);
    if (neighborSlugs.has(sp2.userData.slug)){
      const a = (i / n) * Math.PI*2 + (Math.random()*0.5 - 0.25);
      const r = RING * (0.85 + Math.random()*0.3);
      i++;
      gsap.to(sp2.position, {
        x: p.x + right.x*r*Math.cos(a) + up.x*r*Math.sin(a) - dir.x*DEPTH,
        y: p.y + right.y*r*Math.cos(a) + up.y*r*Math.sin(a) - dir.y*DEPTH,
        z: p.z + right.z*r*Math.cos(a) + up.z*r*Math.sin(a) - dir.z*DEPTH,
        duration:dur, ease:'power3.inOut',
      });
      neighborSprites.push(sp2);
    } else {
      const h = homePos[idx];
      gsap.to(sp2.position, { x:h.x, y:h.y, z:h.z, duration:dur, ease:'power3.inOut' });
    }
  });
  buildWeb(sp, neighborSprites);
  unsettleFor(dur);
}

// covers.json is regenerated daily by a GitHub Action that scrapes the
// archive; fetching it at load time (instead of baking the data into this
// file) means the universe updates itself whenever that Action runs.
async function loadCovers(){
  const res = await fetch('./public/covers.json', { cache:'no-store' });
  if (!res.ok) throw new Error(`covers.json ${res.status}`);
  const { covers: data } = await res.json();

  const pos = layout(data.length, 7);
  data.forEach((c, i) => {
    const tex = loader.load(c.image_thumb, t => {
      t.minFilter = THREE.LinearFilter;
      const ar = (t.image.width / t.image.height) || 0.75;
      sp.scale.set(4.2 * ar, 4.2, 1);
      gsap.fromTo(mat, { opacity:0 }, { opacity:1, duration:0.9, delay:i*0.03, ease:'power2.out' });
    });
    const mat = new THREE.SpriteMaterial({ map:tex, fog:true, transparent:true, opacity:0 });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(3.15, 4.2, 1);
    sp.position.set(pos[i][0], pos[i][1], pos[i][2]);
    sp.userData = c;
    scene.add(sp);
    covers.push(sp);
  });
  bobPhase = covers.map(() => Math.random()*Math.PI*2);
  base = covers.map(sp => sp.position.y);
  homePos = pos.map(([x, y, z]) => ({ x, y, z }));
  document.getElementById('count').textContent = data.length + ' números publicados';
}
loadCovers().catch(err => {
  console.error('Failed to load covers.json:', err);
  document.getElementById('count').textContent = 'No se pudieron cargar las portadas';
});

const ctrl = { target:new THREE.Vector3(), radius:34, theta:0.7, phi:1.3, pan:0 };
let drag=false, px=0, py=0, moved=0, auto=true, selected=null;
const el = renderer.domElement;
el.style.cursor = 'grab';

function applyCamera(){
  const s = Math.sin(ctrl.phi), c = Math.cos(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.radius * s * Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.radius * c,
    ctrl.target.z + ctrl.radius * s * Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);
  if (ctrl.pan){
    camera.updateMatrixWorld();
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const tgt = ctrl.target.clone().addScaledVector(right, ctrl.pan);
    camera.position.addScaledVector(right, ctrl.pan);
    camera.lookAt(tgt);
  }
}

function panFor(radius){
  // On mobile the panel covers the full screen rather than sitting beside
  // it, so there's no reason to shift the close-up off-center for it.
  if (innerWidth <= 700) return 0;
  const w = innerWidth, panelPx = Math.min(400, w * 0.4);
  const visH = 2 * radius * Math.tan((52 * Math.PI/180)/2);
  const visW = visH * (innerWidth / innerHeight);
  return (visW * (panelPx / w)) / 2;
}

const panel = document.getElementById('panel'), hint = document.getElementById('hint');
function showInfo(c){
  document.getElementById('i-title').textContent = decode(c.title);
  document.getElementById('i-sub').textContent = decode(c.sub);
  document.getElementById('i-meta').textContent = decode(c.meta || '');
  const body = document.getElementById('i-body');
  body.innerHTML = '';
  (c.body || []).forEach(p => { const d = document.createElement('div'); d.textContent = decode(p); body.appendChild(d); });
  document.getElementById('i-url').href = c.url;

  // Phone-only grid (hidden by CSS on desktop, where the ring + web already
  // show this). Built regardless of viewport since it's cheap and the images
  // are lazy — but only fetched/laid out once the media query makes it visible.
  const nbrWrap = document.getElementById('i-neighbors');
  nbrWrap.innerHTML = '';
  nearestSlugs(c.slug, 6).forEach(slug => {
    const n = covers.find(sp => sp.userData.slug === slug);
    if (!n) return;
    const img = document.createElement('img');
    img.src = n.userData.image_thumb;
    img.alt = decode(n.userData.title || '');
    img.loading = 'lazy';
    img.onclick = () => focus(n);
    nbrWrap.appendChild(img);
  });

  panel.scrollTop = 0;
}
function revealPanel(){ panel.classList.add('open'); hint.style.display = 'none'; }
function hideInfo(){ panel.classList.remove('open'); hint.style.display = 'block'; }

let revealTween = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function focus(sp){
  selected = sp; showInfo(sp.userData);
  const p = sp.position;
  let theta = Math.atan2(p.x, p.z);
  theta += Math.round((ctrl.theta - theta) / (Math.PI*2)) * Math.PI*2 - Math.PI*2;
  const dur = 1.9;
  highlightSimilar(sp);
  arrangeAround(sp, theta, dur);
  gsap.killTweensOf(ctrl); gsap.killTweensOf(ctrl.target);
  gsap.to(ctrl, { theta, phi:1.5, pan:panFor(7.5), duration:dur, ease:'power3.inOut' });
  gsap.to(ctrl, { keyframes:[{ radius:44, duration:dur*0.45, ease:'power2.out' }, { radius:7.5, duration:dur*0.55, ease:'power3.inOut' }] });
  gsap.to(ctrl.target, { x:p.x, y:p.y, z:p.z, duration:dur, ease:'power3.inOut' });
  // Let the camera fly toward the cover before the panel covers the screen.
  // On mobile the panel is full-width/full-screen, so we wait for the whole
  // close-up to finish (rather than cutting in mid-flight like on desktop)
  // so the text doesn't feel disconnected from the cover it belongs to.
  const revealDelay = innerWidth <= 700 ? dur + 0.15 : dur * 0.4;
  if (revealTween) revealTween.kill();
  revealTween = gsap.delayedCall(revealDelay, revealPanel);
}
function deselect(){
  selected = null;
  if (revealTween) { revealTween.kill(); revealTween = null; }
  hideInfo(); auto = true;
  clearHighlight();
  clearWeb();
  const dur = 1.4;
  covers.forEach((sp2, i) => {
    gsap.killTweensOf(sp2.position);
    const h = homePos[i];
    gsap.to(sp2.position, { x:h.x, y:h.y, z:h.z, duration:dur, ease:'power3.inOut' });
  });
  unsettleFor(dur);
  gsap.killTweensOf(ctrl); gsap.killTweensOf(ctrl.target);
  gsap.to(ctrl, { radius:34, phi:1.3, pan:0, duration:1.4, ease:'power3.inOut' });
  gsap.to(ctrl.target, { x:0, y:0, z:0, duration:1.2, ease:'power3.inOut' });
}
function shuffle(){
  selected = null;
  if (revealTween) { revealTween.kill(); revealTween = null; }
  hideInfo();
  clearHighlight();
  clearWeb();
  const p = layout(covers.length, Math.floor(Math.random()*9999)+2);
  homePos = p.map(([x, y, z]) => ({ x, y, z }));
  covers.forEach((sp,i) => { gsap.killTweensOf(sp.position); base[i] = p[i][1]; gsap.to(sp.position, { x:p[i][0], y:p[i][1], z:p[i][2], duration:1.4, ease:'power2.inOut' }); });
  unsettleFor(1.4);
  gsap.to(ctrl, { radius:34, phi:1.3, pan:0, duration:1.2, ease:'power3.inOut' });
  gsap.to(ctrl.target, { x:0, y:0, z:0, duration:1.2, ease:'power3.inOut' });
  auto = true;
}
document.getElementById('close').onclick = deselect;

function pick(e){
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(covers)[0];
  if (hit) focus(hit.object); else deselect();
}

// Pointer Events unify mouse + touch; one active pointer orbits the camera,
// two active pointers (a pinch) zoom it — mirroring the desktop wheel.
const pointers = new Map();
let pinchDist = null, multiTouch = false;
const pointerDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

el.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  el.setPointerCapture(e.pointerId);
  if (pointers.size === 1){
    drag = true; moved = 0; px = e.clientX; py = e.clientY;
  } else if (pointers.size === 2){
    multiTouch = true;
    const [a, b] = [...pointers.values()];
    pinchDist = pointerDist(a, b);
  }
  el.style.cursor = 'grabbing';
});
addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const d = pointerDist(a, b);
    if (pinchDist != null) ctrl.radius = Math.max(6, Math.min(70, ctrl.radius - (d - pinchDist)*0.05));
    pinchDist = d;
    return;
  }
  if (!drag || pointers.size !== 1) return;
  const dx=e.clientX-px, dy=e.clientY-py;
  moved += Math.abs(dx)+Math.abs(dy);
  px=e.clientX; py=e.clientY;
  ctrl.theta -= dx*0.005;
  ctrl.phi = Math.max(0.25, Math.min(2.9, ctrl.phi - dy*0.005));
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = null;
  if (pointers.size === 1){
    const [remaining] = [...pointers.values()];
    px = remaining.x; py = remaining.y;
  }
  if (pointers.size === 0){
    el.style.cursor = 'grab';
    if (drag && !multiTouch && moved < 5) pick(e);
    drag = false; multiTouch = false;
  }
}
addEventListener('pointerup', endPointer);
addEventListener('pointercancel', endPointer);
el.addEventListener('wheel', e => {
  e.preventDefault();
  ctrl.radius = Math.max(6, Math.min(70, ctrl.radius + e.deltaY*0.03));
}, { passive:false });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
(function tick(){
  const t = (performance.now() - t0)/1000;
  if (auto && !selected) ctrl.theta += 0.0011;
  if (!selected && settled) covers.forEach((sp,i) => { sp.position.y = base[i] + Math.sin(t*0.35 + bobPhase[i])*0.35; });
  if (webLines.length) updateWeb();
  applyCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
