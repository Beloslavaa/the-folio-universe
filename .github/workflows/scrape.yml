name: Scrape covers

on:
  schedule:
    # Runs daily at 06:00 UTC. Adjust as you like (min hour dom mon dow).
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

# Allow the workflow to commit the regenerated JSON back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: npm run scrape

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install embedding dependencies
        run: pip install -r requirements.txt

      - name: Compute embeddings for new covers
        run: npm run embed

      - name: Commit updated covers.json / embeddings.json
        run: |
          git config user.name "folio-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/covers.json public/embeddings.json
          # Only commit if something actually changed.
          if git diff --staged --quiet; then
            echo "No changes to covers.json or embeddings.json."
          else
            git commit -m "chore: update covers.json / embeddings.json ($(date -u +%Y-%m-%d))"
            git push
          fi
