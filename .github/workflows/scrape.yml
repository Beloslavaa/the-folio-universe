name: Scrape covers

on:
  schedule:
    # Runs daily at 06:00 UTC. Adjust as you like (min hour dom mon dow).
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

# Allow the workflow to commit the regenerated JSON back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: npm run scrape

      - name: Commit updated covers.json
        run: |
          git config user.name "folio-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/covers.json
          # Only commit if something actually changed.
          if git diff --staged --quiet; then
            echo "No changes to covers.json."
          else
            git commit -m "chore: update covers.json ($(date -u +%Y-%m-%d))"
            git push
          fi
